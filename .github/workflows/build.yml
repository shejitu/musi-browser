name: build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 检查/补齐
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          ls "$SDK/platforms" 2>/dev/null || true
          if [ ! -d "$SDK/platforms/android-34" ]; then
            SDKM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1 || true)
            echo "sdkmanager=$SDKM"
            if [ -n "$SDKM" ]; then
              yes | "$SDKM" --licenses > /dev/null 2>&1 || true
              "$SDKM" "platforms;android-34" "build-tools;34.0.0" || true
            fi
          fi
          ls "$SDK/platforms"

      - name: Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: assembleRelease
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 收集 APK 并核对签名
        run: |
          set -e
          mkdir -p out
          # 版本号从 build.gradle 读，避免每次发版都改 workflow
          VN=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -1)
          echo "version=$VN"
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "built: $SRC"
          test -n "$SRC"
          cp "$SRC" "out/MusiBrowser-v${VN}.apk"
          ls -la out
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          # 硬闸门：签名不对直接让构建失败，不产出装不上的包
          "$APKSIGNER" verify --print-certs "out/MusiBrowser-v${VN}.apk"
          echo "APK_NAME=MusiBrowser-v${VN}.apk" >> "$GITHUB_ENV"

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: musi-apk
          path: out/*.apk

      # 无 artifact 通道时的取回路径：把 APK 推到 apk 分支
      - name: 推送 apk 分支
        run: |
          set -e
          cd out
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git checkout -q -b apk
          git add -A
          git commit -qm "apk ${APK_NAME} (run ${GITHUB_RUN_NUMBER})"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
